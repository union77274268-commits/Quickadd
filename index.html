<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Listing Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9ecf3;--pn:#fff;--ink:#182033;--mute:#5d677f;--line:#d3d9e6;--blue:#2c47ff;--sun:#ffc21a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.4 'Bricolage Grotesque',system-ui,sans-serif}
header{max-width:1200px;margin:0 auto;padding:22px 20px 0}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em}
header p{margin:4px 0 0;color:var(--mute)}
main{max-width:1200px;margin:0 auto;padding:18px 20px 40px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}
@media(max-width:820px){main{grid-template-columns:1fr}}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#stage{background:var(--pn);border:2px dashed var(--line);border-radius:18px;min-height:440px;display:grid;place-items:center;position:relative;padding:16px}
#stage.has{border-style:solid}
#drop{text-align:center;padding:30px;cursor:pointer}
#drop b{display:block;font-size:22px;font-weight:800}
#drop span{color:var(--mute)}
#stage.over{border-color:var(--blue);background:#f2f4ff}
#view{display:none;max-width:100%;max-height:70vh;border-radius:6px;box-shadow:0 10px 30px rgba(24,32,51,.18);background:repeating-conic-gradient(#e6e9f0 0 25%,#fff 0 50%) 0 0/16px 16px}
.has #view{display:block}.has #drop{display:none}
#bar{grid-column:1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
#msg{flex:1;min-width:160px;color:var(--mute);font-size:14px}
.btn{border:1.5px solid var(--ink);background:var(--pn);border-radius:8px;padding:8px 14px;font-weight:700}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
#q{display:flex;gap:10px;overflow-x:auto;padding:12px 2px 4px}
.it{flex:none;width:84px;height:84px;border-radius:10px;border:2px solid var(--line);background:#fff center/cover;position:relative;padding:0;overflow:hidden}
.it.sel{border-color:var(--blue)}
.it i{position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--line)}
.it.work i{background:var(--sun);animation:p 1s infinite alternate}
.it.done i{background:var(--blue)}.it.err i{background:#d33}
@keyframes p{to{opacity:.3}}
@media(prefers-reduced-motion:reduce){.it.work i{animation:none}}
#panel{background:var(--pn);border-radius:18px;padding:18px;align-self:start}
#panel h2{font-size:16px;font-weight:800;margin:18px 0 8px}#panel h2:first-child{margin-top:0}
label{display:block;margin:10px 0;font-size:14px}
label span{display:flex;justify-content:space-between;color:var(--mute)}
input[type=range]{width:100%;accent-color:var(--blue)}
select{width:100%;padding:7px;border:1.5px solid var(--line);border-radius:8px;background:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw.on,.sg.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.sg{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-weight:700}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink)}
</style></head>
<body>
<header><h1>Listing Studio</h1><p>Raw shelf photos in, marketplace-ready shots out. Everything runs on your device and nothing is uploaded.</p></header>
<main>
<div>
 <section id="stage" aria-live="polite">
  <div id="drop" tabindex="0" role="button"><b>Drop product photos here</b><span>or tap to choose. Add as many as you like.</span></div>
  <canvas id="view" aria-label="Listing preview"></canvas>
 </section>
 <div id="bar">
  <button class="btn" id="add">Add photos</button>
  <button class="btn" id="hold" disabled>Hold to see original</button>
  <span id="msg"></span>
  <button class="btn" id="one" disabled>Download this</button>
  <button class="btn pri" id="all" disabled>Download all (.zip)</button>
 </div>
 <div id="q"></div>
</div>
<aside id="panel">
 <h2>Backdrop</h2>
 <div class="row" id="bgs">
  <button class="sw" data-k="bg" data-v="white" style="background:#fff" title="White"></button>
  <button class="sw" data-k="bg" data-v="studio" style="background:radial-gradient(#fff,#dfe4ec)" title="Studio glow"></button>
  <button class="sw" data-k="bg" data-v="mist" style="background:#eef1f6" title="Mist"></button>
  <button class="sw" data-k="bg" data-v="sand" style="background:#f3ece0" title="Sand"></button>
  <button class="sw" data-k="bg" data-v="ink" style="background:#1c2333" title="Ink"></button>
  <button class="sw" data-k="bg" data-v="clear" style="background:repeating-conic-gradient(#ccd 0 25%,#fff 0 50%) 0 0/10px 10px" title="Transparent PNG"></button>
 </div>
 <label><span>Custom colour</span><input type="color" data-k="color" value="#ffffff"></label>
 <h2>Frame</h2>
 <div class="row">
  <button class="sg" data-k="ratio" data-v="1">1:1</button>
  <button class="sg" data-k="ratio" data-v="1.25">4:5</button>
  <button class="sg" data-k="ratio" data-v="1.3333">3:4</button>
 </div>
 <label>Export width<select data-k="size"><option value="800">800 px</option><option value="1000" selected>1000 px</option><option value="1500">1500 px</option></select></label>
 <label><span>Space around product <em data-o="pad"></em></span><input type="range" data-k="pad" min="0" max="30"></label>
 <label><span>Ground shadow <em data-o="shadow"></em></span><input type="range" data-k="shadow" min="0" max="100"></label>
 <h2>Light and colour</h2>
 <label class="chk"><input type="checkbox" data-k="auto"> Auto-fix lighting</label>
 <label><span>Brightness <em data-o="bright"></em></span><input type="range" data-k="bright" min="-30" max="30"></label>
 <label><span>Contrast <em data-o="contrast"></em></span><input type="range" data-k="contrast" min="-30" max="30"></label>
 <label><span>Colour pop <em data-o="sat"></em></span><input type="range" data-k="sat" min="-50" max="60"></label>
 <label><span>Sharpness <em data-o="sharp"></em></span><input type="range" data-k="sharp" min="0" max="100"></label>
 <button class="btn" id="reset">Reset settings</button>
</aside>
</main>
<input type="file" id="file" accept="image/*" multiple hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="importmap">
{"imports":{
 "@imgly/background-removal":"https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/dist/index.mjs",
 "onnxruntime-web":"https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/esm/ort.min.js",
 "onnxruntime-web/webgpu":"https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/esm/ort.webgpu.min.js",
 "ndarray":"https://cdn.jsdelivr.net/npm/ndarray@1.0.19/+esm",
 "zod":"https://cdn.jsdelivr.net/npm/zod@3.23.8/+esm"}}
</script>
<script type="module">
import { removeBackground } from "@imgly/background-removal";
const $=s=>document.querySelector(s), view=$('#view'), BG={white:'#fff',mist:'#eef1f6',sand:'#f3ece0',ink:'#1c2333'};
const DEF={bg:'studio',color:'#ffffff',ratio:1,size:1000,pad:12,shadow:40,auto:true,bright:0,contrast:6,sat:12,sharp:30};
let S={...DEF}, items=[], cur=-1, busy=false;
const msg=t=>$('#msg').textContent=t||'';

/* ---------- image helpers ---------- */
async function shrink(file,max=1600){
 const bm=await createImageBitmap(file,{imageOrientation:'from-image'}), s=Math.min(1,max/Math.max(bm.width,bm.height));
 const c=document.createElement('canvas'); c.width=Math.round(bm.width*s); c.height=Math.round(bm.height*s);
 c.getContext('2d').drawImage(bm,0,0,c.width,c.height); return c;
}
const blobOf=(c,t='image/jpeg',q=.93)=>new Promise(r=>c.toBlob(r,t,q));
function bbox(bm){ // tight box around visible pixels, so any photo can be centred
 const w=bm.width,h=bm.height,c=document.createElement('canvas'); c.width=w; c.height=h;
 const x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(bm,0,0);
 const d=x.getImageData(0,0,w,h).data; let x0=w,y0=h,x1=-1,y1=-1;
 for(let y=0;y<h;y++)for(let i=0;i<w;i++)if(d[(y*w+i)*4+3]>24){if(i<x0)x0=i;if(i>x1)x1=i;if(y<y0)y0=y;if(y>y1)y1=y}
 return x1<0?null:{x:x0,y:y0,w:x1-x0+1,h:y1-y0+1};
}
function levels(d){ // auto-fix: stretch tones to full range, nudge midtones to a bright, even look
 const H=new Uint32Array(256); let n=0,a=0,lo=0,hi=255,med=128;
 for(let i=0;i<d.length;i+=4)if(d[i+3]>200){H[(d[i]*.3+d[i+1]*.59+d[i+2]*.11)|0]++;n++}
 if(!n)return;
 for(let v=0;v<256;v++){a+=H[v];if(a>=n*.01){lo=v;break}}
 a=0;for(let v=255;v>=0;v--){a+=H[v];if(a>=n*.01){hi=v;break}}
 a=0;for(let v=0;v<256;v++){a+=H[v];if(a>=n/2){med=v;break}}
 if(hi-lo<40)return;
 const m=Math.min(.9,Math.max(.1,(med-lo)/(hi-lo))), g=Math.min(1.25,Math.max(.8,Math.log(.45)/Math.log(m))), L=new Uint8Array(256);
 for(let v=0;v<256;v++)L[v]=255*Math.pow(Math.min(1,Math.max(0,(v-lo)/(hi-lo))),g);
 for(let i=0;i<d.length;i+=4){d[i]=L[d[i]];d[i+1]=L[d[i+1]];d[i+2]=L[d[i+2]]}
}
function sharpen(d,w,h,k){
 const o=new Uint8ClampedArray(d), r=w*4;
 for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=(y*w+x)*4; if(!o[i+3])continue;
  for(let c=0;c<3;c++){const j=i+c; d[j]=o[j]*(1+4*k)-k*(o[j-4]+o[j+4]+o[j-r]+o[j+r])}}
}

/* ---------- the listing shot ---------- */
function paint(c,w,h){
 if(S.bg==='clear')return;
 if(S.bg==='studio'){const g=c.createRadialGradient(w/2,h*.45,0,w/2,h*.5,h*.78);g.addColorStop(0,'#fff');g.addColorStop(1,'#dfe4ec');c.fillStyle=g}
 else c.fillStyle=S.bg==='custom'?S.color:BG[S.bg];
 c.fillRect(0,0,w,h);
}
function render(it,cv,w){
 const h=Math.round(w*S.ratio), b=it.box, p=S.pad/100; cv.width=w; cv.height=h;
 const c=cv.getContext('2d'); paint(c,w,h);
 const sc=Math.min(w*(1-2*p)/b.w,h*(1-2*p)/b.h), dw=Math.max(2,Math.round(b.w*sc)), dh=Math.max(2,Math.round(b.h*sc)), dx=(w-dw)/2, dy=(h-dh)/2;
 const t=document.createElement('canvas'); t.width=dw; t.height=dh;
 const x=t.getContext('2d',{willReadFrequently:true}); x.imageSmoothingQuality='high'; x.drawImage(it.cut,b.x,b.y,b.w,b.h,0,0,dw,dh);
 const im=x.getImageData(0,0,dw,dh);
 if(S.auto)levels(im.data); if(S.sharp)sharpen(im.data,dw,dh,S.sharp/100*.6); x.putImageData(im,0,0);
 if(S.shadow){const sw=dw*.85, sh=Math.max(6,dh*.08); c.save(); c.translate(w/2,dy+dh-sh*.2); c.scale(1,sh/sw);
  const g=c.createRadialGradient(0,0,0,0,0,sw/2); g.addColorStop(0,`rgba(20,25,40,${S.shadow/100*.5})`); g.addColorStop(1,'rgba(20,25,40,0)');
  c.fillStyle=g; c.beginPath(); c.arc(0,0,sw/2,0,7); c.fill(); c.restore();}
 c.filter=`brightness(${1+S.bright/100}) contrast(${1+S.contrast/100}) saturate(${1+S.sat/100})`;
 c.drawImage(t,dx,dy); c.filter='none';
}

/* ---------- UI ---------- */
function show(orig){
 const it=items[cur]; $('#stage').classList.toggle('has',items.length>0);
 if(!it)return;
 if(it.st==='done'&&!orig)render(it,view,720);
 else{const s=Math.min(1,720/it.img.width); view.width=it.img.width*s; view.height=it.img.height*s; view.getContext('2d').drawImage(it.img,0,0,view.width,view.height)}
 const d=items.filter(i=>i.st==='done').length;
 $('#hold').disabled=it.st!=='done'; $('#one').disabled=it.st!=='done'; $('#all').disabled=!d;
}
function queue(){
 const q=$('#q'); q.innerHTML='';
 items.forEach((it,i)=>{const b=document.createElement('button'); b.className='it '+it.st+(i===cur?' sel':''); b.style.backgroundImage=`url(${it.url})`;
  b.title=it.name; b.innerHTML='<i></i>'; b.onclick=()=>{cur=i;queue();show()}; q.append(b)});
}
async function add(files){
 for(const f of files){ if(!f.type.startsWith('image/'))continue;
  try{const img=await shrink(f), blob=await blobOf(img,'image/jpeg',.95);
   items.push({name:f.name,img,blob,url:URL.createObjectURL(blob),st:'wait'})}catch(e){msg('Could not open '+f.name)} }
 if(cur<0&&items.length)cur=0; queue(); show(); run();
}
async function run(){
 if(busy)return; busy=true;
 for(const it of items){ if(it.st!=='wait')continue;
  it.st='work'; queue(); if(items[cur]===it)show(true); const n=items.indexOf(it)+1;
  msg(`Cutting out photo ${n} of ${items.length}. The first run downloads the AI model (about 40 MB).`);
  try{
   const progress=(k,a,t)=>{if(String(k).startsWith('fetch')&&t)msg(`Downloading AI model ${Math.round(a/t*100)}%`)};
   let out; try{out=await removeBackground(it.blob,{progress})}catch(e){console.warn('Retrying without worker',e); out=await removeBackground(it.blob,{progress,proxyToWorker:false})}
   it.cut=await createImageBitmap(out); it.box=bbox(it.cut); if(!it.box)throw new Error('nothing found');
   it.st='done';
  }catch(e){it.st='err'; msg('Cutout failed. The first run needs an internet connection. '+(e.message||'')); console.error(e)}
  queue(); show();
 }
 busy=false; if(!items.some(i=>i.st==='err'))msg(items.length?'Done. Adjust the settings and every photo updates.':'');
}
async function exportOne(it){
 const cv=document.createElement('canvas'), clear=S.bg==='clear'; render(it,cv,S.size);
 return {blob:await blobOf(cv,clear?'image/png':'image/jpeg'),name:it.name.replace(/\.[^.]+$/,'')+'-listing.'+(clear?'png':'jpg')};
}
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
$('#one').onclick=async()=>{const r=await exportOne(items[cur]);save(r.blob,r.name)};
$('#all').onclick=async()=>{
 const done=items.filter(i=>i.st==='done'); msg('Building your files...');
 if(done.length===1){const r=await exportOne(done[0]);save(r.blob,r.name);msg('');return}
 const z=new JSZip(), seen={};
 for(const it of done){const r=await exportOne(it); seen[r.name]=(seen[r.name]||0)+1; z.file(seen[r.name]>1?r.name.replace(/(\.\w+)$/,`-${seen[r.name]}$1`):r.name,r.blob)}
 save(await z.generateAsync({type:'blob'}),'listing-photos.zip'); msg(`Saved ${done.length} photos.`);
};

/* controls */
function sync(){
 document.querySelectorAll('[data-k]').forEach(e=>{const k=e.dataset.k;
  if(e.dataset.v!==undefined)e.classList.toggle('on',String(S[k])===e.dataset.v);
  else if(e.type==='checkbox')e.checked=S[k]; else e.value=S[k]});
 document.querySelectorAll('[data-o]').forEach(e=>e.textContent=S[e.dataset.o]);
}
let raf; const redraw=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>show())};
document.addEventListener('click',e=>{const b=e.target.closest('button[data-v]'); if(!b)return;
 S[b.dataset.k]=isNaN(b.dataset.v)?b.dataset.v:+b.dataset.v; sync(); redraw()});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k; if(!k||t.dataset.v!==undefined)return;
 S[k]=t.type==='checkbox'?t.checked:t.type==='color'?t.value:+t.value; if(k==='color')S.bg='custom'; sync(); redraw()});
$('#reset').onclick=()=>{S={...DEF};sync();redraw()};

/* input + compare */
const fi=$('#file'); $('#add').onclick=()=>fi.click(); $('#drop').onclick=()=>fi.click();
$('#drop').onkeydown=e=>{if(e.key==='Enter'||e.key===' ')fi.click()};
fi.onchange=()=>{add([...fi.files]);fi.value=''};
const st=$('#stage');
['dragover','dragenter'].forEach(v=>document.addEventListener(v,e=>{e.preventDefault();st.classList.add('over')}));
['dragleave','drop'].forEach(v=>document.addEventListener(v,e=>{e.preventDefault();st.classList.remove('over')}));
document.addEventListener('drop',e=>add([...e.dataTransfer.files]));
const h=$('#hold'); h.onpointerdown=()=>show(true); ['pointerup','pointerleave','pointercancel'].forEach(v=>h.addEventListener(v,()=>show()));
sync();
</script>
</body></html>
