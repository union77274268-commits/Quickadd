<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Meraki Quick Product Add</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033}
.app{max-width:900px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{margin:0;font-size:24px}.sub{color:#697386;font-size:13px;margin-top:4px}
.card{background:white;border:1px solid #e4e8ef;border-radius:18px;padding:18px;box-shadow:0 8px 25px #1720330d}
.scan{display:flex;gap:10px;margin-bottom:18px}.scan input{flex:1;padding:14px;border:1px solid #ccd3df;border-radius:12px;font-size:16px}
button{border:0;border-radius:12px;padding:13px 17px;font-weight:700;cursor:pointer;background:#2563eb;color:white}
button.secondary{background:#eef2ff;color:#1d4ed8}.camera{background:#111827}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{font-size:12px;font-weight:700;color:#596579;display:block;margin-bottom:6px}
input,select{width:100%;padding:12px;border:1px solid #d5dbe5;border-radius:10px;font-size:15px;background:white}
.full{grid-column:1/-1}.actions{display:flex;gap:10px;margin-top:16px}
table{width:100%;border-collapse:collapse;margin-top:18px;font-size:14px}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #edf0f4}
th{font-size:12px;color:#697386}
.empty{text-align:center;color:#8a94a6;padding:25px}
.status{margin-top:10px;font-size:13px;color:#2563eb;min-height:18px}
#reader{display:none;margin-top:12px;border-radius:12px;overflow:hidden}
@media(max-width:650px){.app{padding:12px}.form{grid-template-columns:1fr}.full{grid-column:auto}.scan{flex-wrap:wrap}.scan input{min-width:100%}.actions button{flex:1}}
</style>
</head>
<body>
<div class="app">
<header>
  <div><h1>Quick Product Add</h1><div class="sub">Scan barcode → enter details → save product</div></div>
  <button class="secondary" onclick="exportCSV()">Export CSV</button>
</header>

<div class="card">
  <div class="scan">
    <input id="barcode" placeholder="Scan or enter barcode" autofocus inputmode="numeric">
    <button class="camera" onclick="startScanner()">▣ Scan Camera</button>
    <button class="secondary" onclick="lookupBarcode()">↗ Lookup</button>
  </div>
  <div id="reader"></div>
  <div class="status" id="status"></div>
  <div id="lookupInfo" style="font-size:12px;color:#697386;margin-bottom:12px"></div>

  <div class="form">
    <div><label>Product Name *</label><input id="name" placeholder="e.g. Classmate Notebook"></div>
    <div><label>Brand</label><input id="brand" placeholder="e.g. Classmate"></div>
    <div><label>MRP *</label><input id="mrp" type="number" min="0" step="0.01" placeholder="0"></div>
    <div><label>Purchase Price</label><input id="cost" type="number" min="0" step="0.01" placeholder="0"></div>
    <div><label>Quantity *</label><input id="qty" type="number" min="0" step="1" value="1"></div>
    <div><label>Category</label>
      <select id="category">
        <option>Stationery</option><option>Toys</option><option>School Bags</option>
        <option>Art & Craft</option><option>Gifts</option><option>Other</option>
      </select>
    </div>
  </div>
  <div class="actions">
    <button onclick="saveProduct()">＋ Save Product</button>
    <button class="secondary" onclick="clearForm()">Clear</button>
  </div>
</div>

<div class="card" style="margin-top:16px">
  <b>Recently Added</b>
  <table><thead><tr><th>Barcode</th><th>Product</th><th>MRP</th><th>Qty</th><th>Category</th></tr></thead>
  <tbody id="products"></tbody></table>
</div>
</div>

<script>
const KEY='meraki_quick_products_v1';
let products=JSON.parse(localStorage.getItem(KEY)||'[]');

async function lookupBarcode(auto=false){
 const code=document.getElementById('barcode').value.trim();
 if(!code){setStatus('Scan or enter a barcode first.',true);return}
 setStatus('Looking up product…');
 document.getElementById('lookupInfo').textContent='';
 try{
   const res=await fetch('https://api.upcitemdb.com/prod/trial/lookup?upc='+encodeURIComponent(code));
   if(!res.ok) throw new Error('API error');
   const data=await res.json();
   if(!data.items || !data.items.length){
     setStatus('Barcode not found. Enter product details manually.',true);
     document.getElementById('name').focus();
     return;
   }
   const item=data.items[0];
   document.getElementById('name').value=item.title||'';
   document.getElementById('brand').value=item.brand||'';
   const cat=(item.category||'').toLowerCase();
   if(cat.includes('toy')) document.getElementById('category').value='Toys';
   else if(cat.includes('station')) document.getElementById('category').value='Stationery';
   else if(cat.includes('bag')) document.getElementById('category').value='School Bags';
   else if(cat.includes('craft')||cat.includes('art')) document.getElementById('category').value='Art & Craft';
   else if(cat.includes('gift')) document.getElementById('category').value='Gifts';
   if(item.offers && item.offers.length && item.offers[0].price){
     document.getElementById('mrp').value=item.offers[0].price;
   }
   document.getElementById('lookupInfo').textContent='Product information retrieved from UPCitemdb. Verify MRP before saving.';
   setStatus('Product found — details autofilled.');
   document.getElementById('mrp').focus();
 }catch(e){
   setStatus('Lookup failed. Check internet connection or try again later.',true);
   document.getElementById('name').focus();
 }
}

function render(){
 const body=document.getElementById('products');
 if(!products.length){body.innerHTML='<tr><td colspan="5" class="empty">No products added yet</td></tr>';return}
 body.innerHTML=products.slice().reverse().slice(0,50).map(p=>`
 <tr><td>${esc(p.barcode||'-')}</td><td>${esc(p.name)}</td><td>₹${Number(p.mrp).toFixed(2)}</td>
 <td>${p.qty}</td><td>${esc(p.category)}</td></tr>`).join('');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function saveProduct(){
 const barcode=document.getElementById('barcode').value.trim();
 const name=document.getElementById('name').value.trim();
 const mrp=document.getElementById('mrp').value;
 const qty=document.getElementById('qty').value;
 if(!name||!mrp||qty===''){setStatus('Enter Product Name, MRP and Quantity.',true);return}
 const product={barcode,name,brand:brand.value.trim(),mrp:Number(mrp),cost:Number(cost.value||0),qty:Number(qty),category:category.value,createdAt:new Date().toISOString()};
 products.push(product);localStorage.setItem(KEY,JSON.stringify(products));render();
 setStatus('Product saved successfully.');
 clearForm(false);
}
function clearForm(focus=true){
 document.getElementById('lookupInfo').textContent='';
 ['barcode','name','brand','mrp','cost'].forEach(id=>document.getElementById(id).value='');
 document.getElementById('qty').value=1;
 if(focus)document.getElementById('barcode').focus();
}
function setStatus(t,error=false){const e=document.getElementById('status');e.textContent=t;e.style.color=error?'#dc2626':'#2563eb'}
function exportCSV(){
 if(!products.length){setStatus('No products to export.',true);return}
 const rows=[['Barcode','Name','Brand','MRP','Purchase Price','Quantity','Category','Created At'],
 ...products.map(p=>[p.barcode,p.name,p.brand,p.mrp,p.cost,p.qty,p.category,p.createdAt])];
 const csv=rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='meraki-products.csv';a.click();
}
let scanner;
async function startScanner(){
 const reader=document.getElementById('reader');
 if(!window.isSecureContext){setStatus('Camera scanning requires HTTPS or localhost.',true);return}
 if(!window.Html5Qrcode){
   await loadScript('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js');
 }
 reader.style.display='block';
 scanner=new Html5Qrcode('reader');
 try{
   await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:120}},
    decoded=>{document.getElementById('barcode').value=decoded;setStatus('Barcode scanned: '+decoded);stopScanner();lookupBarcode(true)},
    ()=>{});
 }catch(e){setStatus('Could not start camera. Check camera permission.',true);reader.style.display='none'}
}
async function stopScanner(){
 if(scanner){try{await scanner.stop();scanner.clear()}catch(e){}scanner=null}
 document.getElementById('reader').style.display='none';
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
document.getElementById('barcode').addEventListener('keydown',e=>{if(e.key==='Enter'){lookupBarcode(true)}});
render();
</script>
</body>
</html>
